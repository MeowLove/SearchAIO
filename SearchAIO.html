<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SearchAIO：在一个可切换的搜索舞台中路由至多个搜索与 AI 服务。">
  <meta name="referrer" content="no-referrer">
  <title>SearchAIO</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="corner-ribbon github-ribbon" href="https://github.com/MeowLove/SearchAIO" target="_blank" rel="noopener noreferrer">View on GitHub</a>
  <a class="corner-ribbon author-ribbon" href="https://www.cxthhhhh.com" target="_blank" rel="noopener noreferrer">CXT's Website</a>

  <main class="app-shell" id="app-shell">
    <section class="search-stage" aria-labelledby="stage-title">
      <p class="stage-kicker" id="stage-kicker">SearchAIO</p>
      <div class="engine-brand" aria-live="polite">
        <img class="engine-logo" id="engine-logo" src="./img/google_logo.png" alt="Google">
        <span class="engine-wordmark is-hidden" id="engine-wordmark"></span>
      </div>
      <h1 class="visually-hidden" id="stage-title">SearchAIO</h1>

      <form class="search-form" id="search-form" novalidate>
        <label class="visually-hidden" for="search-input" data-i18n="searchLabel">搜索内容</label>
        <div class="search-field-wrap">
          <button class="engine-chip" id="engine-chip" type="button" aria-haspopup="dialog" aria-controls="engine-catalog-dialog" aria-expanded="false">
            <span class="engine-chip-icon" id="engine-chip-icon" aria-hidden="true"></span>
            <span class="engine-chip-name" id="engine-chip-name"></span>
          </button>
          <input id="search-input" name="query" type="search" autocomplete="off" spellcheck="true" aria-autocomplete="list" aria-controls="engine-suggestions" aria-expanded="false">
          <button class="clear-query is-hidden" id="clear-query" type="button" aria-label="清除搜索内容">×</button>
          <button class="primary-button search-submit" id="search-button" type="submit"></button>
          <div class="suggestions is-hidden" id="engine-suggestions" role="listbox" aria-label="搜索引擎建议"></div>
        </div>
      </form>

      <section class="engine-panel" id="engine-panel" aria-labelledby="engine-panel-title">
        <div class="panel-heading">
          <div>
            <p class="eyebrow" data-i18n="enginePanelEyebrow">搜索目的地</p>
            <h2 id="engine-panel-title" data-i18n="enginePanelTitle">选择搜索引擎</h2>
          </div>
          <button class="favorite-toggle" id="favorite-toggle" type="button" aria-pressed="false"></button>
        </div>
        <p class="engine-description" id="engine-description"></p>
        <div class="engine-groups" id="engine-groups"></div>
      </section>

      <section class="tutorial-panel" id="tutorial-panel" aria-labelledby="tutorial-title">
        <div>
          <p class="eyebrow" data-i18n="tutorialEyebrow">我帮你搜索</p>
          <h2 id="tutorial-title" data-i18n="tutorialTitle">生成可分享的教学链接</h2>
          <p data-i18n="tutorialDescription">链接会按当前搜索引擎的搜索舞台输入内容，再跳转到对应网站。</p>
        </div>
        <div class="tutorial-actions">
          <button class="primary-button" id="copy-link-button" type="button" data-i18n="copyLink"></button>
          <button class="secondary-button is-hidden" id="share-link-button" type="button" data-i18n="directShare"></button>
        </div>
      </section>
    </section>
  </main>

  <div class="tutorial-cursor is-hidden" id="tutorial-cursor" aria-hidden="true"></div>
  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

  <dialog class="modal" id="shortcuts-dialog" aria-labelledby="shortcuts-title">
    <div class="modal-content">
      <div class="modal-heading">
        <h2 id="shortcuts-title" data-i18n="shortcutsTitle">键盘快捷键</h2>
        <button class="icon-button" id="close-shortcuts" type="button" aria-label="关闭">×</button>
      </div>
      <dl class="shortcut-list">
        <div><dt><kbd>Ctrl</kbd> + <kbd>K</kbd></dt><dd data-i18n="shortcutFocus">聚焦搜索框</dd></div>
        <div><dt><kbd>Alt</kbd> + <kbd>↑</kbd> / <kbd>↓</kbd></dt><dd data-i18n="shortcutCycle">切换搜索引擎</dd></div>
        <div><dt><kbd>!</kbd><span data-i18n="shortcutBangExample">g 查询</span></dt><dd data-i18n="shortcutBang">用 !bang 路由搜索</dd></div>
        <div><dt><kbd>Esc</kbd></dt><dd data-i18n="shortcutClose">关闭建议或弹窗</dd></div>
      </dl>
    </div>
  </dialog>

  <dialog class="modal engine-catalog-dialog" id="engine-catalog-dialog" aria-labelledby="engine-catalog-title">
    <div class="modal-content">
      <div class="modal-heading">
        <div>
          <p class="eyebrow" data-i18n="catalogEyebrow">完整目录</p>
          <h2 id="engine-catalog-title" data-i18n="catalogTitle">全部搜索引擎</h2>
        </div>
        <button class="icon-button" id="close-engine-catalog" type="button" aria-label="关闭">×</button>
      </div>
      <label class="visually-hidden" for="engine-catalog-search" data-i18n="catalogSearchLabel">筛选搜索引擎</label>
      <input class="engine-catalog-search" id="engine-catalog-search" type="search" autocomplete="off" data-i18n-placeholder="catalogSearchPlaceholder" placeholder="搜索名称、前缀或 !bang">
      <div class="engine-catalog-groups" id="engine-catalog-groups"></div>
    </div>
  </dialog>

  <footer class="page-footer">
    <span data-i18n="footerPrivacy">偏好设置只保存在此浏览器中。</span>
    <button class="footer-shortcuts" id="shortcuts-button" type="button" aria-haspopup="dialog">
      <span class="footer-shortcuts-icon" aria-hidden="true">⌨</span>
      <span data-i18n="shortcutsTitle">键盘快捷键</span>
      <span class="footer-route-hint" id="footer-route-hint"></span>
    </button>
    <div class="footer-controls">
      <div class="language-switcher" id="language-switcher" aria-label="Language">
        <button type="button" data-language="zh">ZH</button>
        <button type="button" data-language="en">EN</button>
        <button type="button" data-language="ru">RU</button>
      </div>
      <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="切换主题">◐</button>
    </div>
  </footer>

  <script>
    const runtimeScript = document.createElement('script');
    const useStandaloneRuntime = window.location.protocol === 'file:' || new URLSearchParams(window.location.search).has('standalone');
    if (useStandaloneRuntime) {
      runtimeScript.src = './src/main.standalone.js';
    } else {
      runtimeScript.type = 'module';
      runtimeScript.src = './src/main.js';
    }
    document.body.append(runtimeScript);
  </script>
</body>
</html>
