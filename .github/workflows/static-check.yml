name: Static checks

on:
  push:
    paths:
      - 'SearchAIO.html'
      - 'styles.css'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/static-check.yml'
  pull_request:
    paths:
      - 'SearchAIO.html'
      - 'styles.css'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/static-check.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
